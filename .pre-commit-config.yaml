# Ref: https://pre-commit.com/#pre-commit-configyaml---top-level
# Install with `poetry run pre-commit install`. The hooks run the tools of the project environment.

default_install_hook_types: [pre-push]

repos:
  - repo: local
    hooks:
      - id: reuse
        name: reuse
        language: system
        entry: "poetry run reuse lint"
        stages: [pre-push]
        pass_filenames: false
