# Generation settings per request dataset: the key is the `--dataset` argument of
# scripts/Run_Inferences.py and names datasets/Bits_Datasets/<key>.csv.
# The requests of a run are the rows of the CSV.

FLiPS_ICML:  # all base and quantized instances
  min_seq_length: 100
  dyn_checking_batch_size: 500
  TOP_K: 50  # Hugging Face default
  max_model_len: 2048
  MAX_TOKENS: 500
  TOKEN_PAIRS_SET: FLIPS_SET_OF_TOKEN_PAIRS

FLiPS_ICML_uncensored:  # abliterated instances (temperature 1.0, no system prompt)
  min_seq_length: 100
  dyn_checking_batch_size: 500
  TOP_K: 50  # Hugging Face default
  max_model_len: 2048
  MAX_TOKENS: 500
  TOKEN_PAIRS_SET: FLIPS_SET_OF_TOKEN_PAIRS
