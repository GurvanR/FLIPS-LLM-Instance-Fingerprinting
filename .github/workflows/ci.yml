name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (advisory)
        run: poetry run flake8 src/audit_llm/
        continue-on-error: true

      - name: Import smoke
        run: poetry run python -c "import audit_llm; print('audit_llm OK')"

      # Unit tests, regression tests on the in-repo fixture (tests/fixtures/), analysis-tier tests.
      # Tests that need the generation extras or the results archive skip when those are absent.
      - name: Tests
        run: poetry run python -m pytest tests -q

      # Closed-set pipeline on the fixture, with sanity checks on its accuracies.
      - name: Smoke gate
        run: poetry run python scripts/gates/gate_a.py

      - name: Licence metadata
        run: poetry run reuse lint
