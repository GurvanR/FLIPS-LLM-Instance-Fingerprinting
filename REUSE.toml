# REUSE / SPDX compliance for the FLIPS repository.
# Ref: https://reuse.software/spec-3.3/#reusetoml
#
# Every [[annotations]] block carries both SPDX-FileCopyrightText and SPDX-License-Identifier.
# Licensing buckets:
#   - first-party code / config / CI / docs  -> MIT (PEReN)
#   - datasets, derived data and results, test fixtures, reference outputs -> CC-BY-4.0 (PEReN). The blanket
#     CC-BY-4.0 tag does NOT override the stricter per-model OUTPUT terms (Cohere Command-R / Aya = CC-BY-NC,
#     Gemma = Gemma Terms of Use) — see data/LICENSE and docs/provenance.md.
#   - generated lockfiles                      -> CC0-1.0
#
# Blocks are ordered so the more specific intent wins on overlaps (the last matching block wins):
# data after code.
version = 1

# Generated lockfile: no creative content.
[[annotations]]
path = ["poetry.lock"]
SPDX-FileCopyrightText = "2026 Pôle d'Expertise de la Régulation Numérique <contact@peren.gouv.fr>"
SPDX-License-Identifier = "CC0-1.0"

# First-party source, scripts, experiment configs, tests, config, the analysis tier, CI workflows, and loose
# repo-root config files.
[[annotations]]
path = ["src/**", "scripts/**", "XP_configs/**", "tests/**", "config/**", "paper/**", ".github/**", "Makefile", ".gitignore", "Productions/.gitignore", ".env.example", "CITATION.cff"]
SPDX-FileCopyrightText = "2026 Pôle d'Expertise de la Régulation Numérique <contact@peren.gouv.fr>"
SPDX-License-Identifier = "MIT"

# First-party documentation.
[[annotations]]
path = ["docs/**", "README.md"]
SPDX-FileCopyrightText = "2026 Pôle d'Expertise de la Régulation Numérique <contact@peren.gouv.fr>"
SPDX-License-Identifier = "MIT"

# Datasets, derived data and results (CC-BY-4.0): request tables, vocabulary, released-data wiring, the test
# fixture and the reference outputs of the analysis tier. Per-model OUTPUT terms still apply on top — see
# data/LICENSE and docs/provenance.md (Cohere CC-BY-NC, Gemma ToU).
[[annotations]]
path = ["data/**", "datasets/**", "Productions/Intersection_vocab/**", "tests/fixtures/**", "paper/expected/**"]
SPDX-FileCopyrightText = "2026 Pôle d'Expertise de la Régulation Numérique <contact@peren.gouv.fr>"
SPDX-License-Identifier = "CC-BY-4.0"
