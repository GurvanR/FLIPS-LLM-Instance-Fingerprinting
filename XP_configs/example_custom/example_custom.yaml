# Template: run the closed-set pipeline on your own set of instances. Copy this file and edit.
# The `scenario:` key selects which generated (model x variation) instances become classes
# (config/scenarios/example_custom.yaml: 2 LLMs x 2 temperatures = 4 instances, all present in the
# in-repo fixture, so this runs on CPU with no download).
#   python -m audit_llm.pipeline run --config XP_configs/example_custom/example_custom.yaml \
#       --answers tests/fixtures/answers.parquet --out /tmp/flips_example
#   Scenario field rules: config/scenarios/README.md
experiment_fun: closed_set
scenario: example_custom
token_pairs: [ali-yg, df-bits]
batch_sizes: [1, 2, 4, 8]
protocol:
  splits: [0]
  test_per_class: 40
  inner_val: 10
  n_train: 100
