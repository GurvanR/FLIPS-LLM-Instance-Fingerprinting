[tool.poetry]
name = "flips"
version = "2.0.0"
description = "FLIPS: Instance-Fingerprinting for LLMs via Pseudo-random Sequences. Code and data of the paper. The importable package is `audit_llm`."
readme = "README.md"
authors = ["Pôle d'Expertise de la Régulation Numérique <contact@peren.gouv.fr>"]
license = "MIT"
repository = "https://github.com/GurvanR/FLIPS-LLM-Instance-Fingerprinting"
keywords = ["LLM", "fingerprinting", "instance identification", "random sequences", "NIST statistical tests"]
# The distribution is named `flips`; the importable package is `audit_llm`.
# The chat templates under LLM_Classes/chat_templates/ are package data (tracked, hence included in the wheel).
packages = [
    { include = "audit_llm", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.4.2"
scipy = "^1.17.0"
pandas = "^3.0.0"
polars = "^1.38.1"
# The statistics, the XGBoost fits and the Unseen detector are numerics-sensitive: the paper's results were
# computed with scikit-learn 1.8 and xgboost 3.2 (xgboost's `hist` method also depends on the thread count,
# see docs/reproduction/recompute.md).
scikit-learn = "^1.8.0"
xgboost = "~3.2"
pyarrow = ">=10.0"
pyyaml = "^6.0.3"
pydantic = "^2.10"
tqdm = "^4.67.3"
matplotlib = "^3.9"
packaging = "^26.0"
overrides = "^7.7.0"

# Faster feature statistics (same arithmetic, compiled): poetry install --extras speed
numba = { version = ">=0.60", optional = true, python = "<3.15" }

# GPU generation (optional): poetry install --extras generation. vLLM is installed separately,
# against the CUDA / torch build of the machine (docs/reproduction/generation.md).
torch = { version = ">=2.5", optional = true }
transformers = { version = ">=4.47", optional = true }
huggingface-hub = { version = ">=0.27", optional = true }
jinja2 = { version = "^3.1", optional = true }

[tool.poetry.extras]
speed = ["numba"]
generation = ["torch", "transformers", "huggingface-hub", "jinja2"]

[tool.poetry.group.dev.dependencies]
flake8 = "^7.2"
black = { extras = ["jupyter"], version = "^25.1" }
pylint = "^3.3"
pytest = "^8.3"
pytest-cov = "^6.1"
pre-commit = "^4.2"
licensecheck = "^2025.1"
reuse = "^5.0"
pyright = { extras = ["nodejs"], version = "^1.1" }
isort = "^6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.licensecheck]
format = "ansi"
zero = true
# Packages that have been reviewed and do not come with a license, or that are incorrectly flagged as
# incompatible.
ignore_packages = [
    "pylint",  # GPL but used as an external tool (not imported)
    "reuse",  # Used as an external tool
]
ignore_licenses = [
  "MPL"  # See https://github.com/FHPythonUtils/LicenseCheck/issues/86
]

[tool.pylint.main]
fail-under = 9.0
output-format = "colorized"
# extension-pkg-allow-list = ["pydantic"]  # Uncomment if you use pydantic
load-plugins = [
#   "pylint_pydantic",  # Uncomment if you use pydantic
  "pylint.extensions.check_elif",
  "pylint.extensions.bad_builtin",
  "pylint.extensions.docparams",
  "pylint.extensions.for_any_all",
  "pylint.extensions.set_membership",
  "pylint.extensions.code_style",
  "pylint.extensions.overlapping_exceptions",
  "pylint.extensions.typing",
  "pylint.extensions.redefined_variable_type",
  "pylint.extensions.comparison_placement",
  "pylint.extensions.broad_try_clause",
  "pylint.extensions.dict_init_mutate",
  "pylint.extensions.consider_refactoring_into_while_condition",
]
ignore = [".git", "__pycache__", ".venv", ".cache"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
  "R",  # refactor
  "C",  # convention
  "fixme",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_data: test needs the results archive unpacked under $FLIPS_DATA (default data/); skipped when it is absent",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
  # Don't complain about missing debug-only code:
  "def __repr__",
  # Don't complain if tests don't hit defensive assertion code:
  "raise NotImplementedError",
  # Don't complain about abstract methods, they aren't run:
  "@(abc\\.)?abstractmethod",
  # Don't complain for main code:
  'if __name__ == "__main__":',
]

[tool.pyright]
# ref: https://github.com/microsoft/pyright/blob/main/docs/configuration.md
# Uncomment the following line to activate strict type checking
# typeCheckingMode = "strict"

[tool.isort]
profile = "black"
line_length = 120
no_lines_before = ["LOCALFOLDER"]
skip_gitignore = true
lines_after_imports = 2
